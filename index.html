<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lunar's Shop</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="hero-box">

            <h1>🍪 Lunar's Shop</h1>

            <p>
                Soft & Fresh Cookies, Delivered to Your Class!
            </p>

            <div class="nav-btn">

                <a href="checkout.html" class="btn checkout">
                    🧾 Checkout
                </a>

                <a href="cart.html" class="btn cart" id="cartButton">
                    🛒 Keranjang
                </a>

            </div>

        </div>

    </header>

    <section class="container">
        <div class="product">
            <img src="coklat.jpg" alt="Chocolate Soft Cookie">
            <h3>🍪 Chocolate Soft Cookie</h3>
            <p class="price">
                Rp15.000
            </p>
            <button onclick="buyNow('Chocolate Soft Cookie',15000,'coklat.jpg')" class="btn-now">
             💳 Checkout Sekarang
            </button>
            
            <button onclick="addToCart('Chocolate Soft Cookie',15000,'coklat.jpg',this)">
                🛒 Masukkan Ke Keranjang
            </button>

        </div>

        <div class="product">
            <img src="original.jpg" alt="Original Soft Cookie">
            <h3>🍪 Original Soft Cookie</h3>
            <p class="price">
                Rp13.000
            </p>
            <button onclick="buyNow('Original Soft Cookie',13000,'original.jpg')" class="btn-now">
             💳 Checkout Sekarang
            </button>
            
            <button onclick="addToCart('Original Soft Cookie',13000,'original.jpg',this)">
                🛒 Masukkan Ke Keranjang
            </button>

        </div>

        <div class="product">
            <span class="badge">
                BUNDLING
            </span>
            <img src="bundling.jpg" alt="Cookies Bundle">

            <h3>🍪🥛 Cookies Bundle</h3>
           
            <p class="price">
                Rp18.000
            </p>

            <button onclick="buyNow('Cookies Bundle',18000,'bundling.jpg')">
                💳 Checkout Sekarang
            </button>
            
                <button onclick="addToCart('Cookies Bundle',18000,'bundling.jpg',this)">
                    🛒 Masukkan Ke Keranjang
                </button>

        </div>

    </section>

    <footer>

        <p>
            © 2026 Lunar's Shop | Soft Cookies, Delivered to Your Class!
        </p>

    </footer>

    <div id="toast" class="toast">

        ✅ Produk berhasil ditambahkan!

    </div>

    <script src="script.js"></script>

</body>

</html>
